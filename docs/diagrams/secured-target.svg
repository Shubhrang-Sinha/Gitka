<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1420" viewBox="0 0 1900 1420"><rect width="1900" height="1420" fill="#f5f8fc"/><g font-family="DejaVu Sans, sans-serif"><text x="80" y="77" font-size="38" fill="#14263a" font-weight="700">GITKA  /  Secured deployment pattern</text><text x="80" y="117" font-size="19" fill="#52718b" font-weight="700">ILLUSTRATIVE TARGET  ·  Deployment details require confirmation</text><rect x="65" y="150" width="1510" height="575" rx="20" fill="#ffffff" stroke="#bed0df" stroke-width="2"/><text x="92" y="189" font-size="19" fill="#50708b" font-weight="700">TOPOLOGY OVERVIEW  /  CLIENT AND DEPLOYMENT SERVICES</text><rect x="90" y="215" width="290" height="210" rx="16" fill="#f6f9fc" stroke="#d1dce7" stroke-width="2"/><text x="112" y="248" font-size="17" fill="#56718a" font-weight="700">CLIENT TOOLS</text><rect x="110" y="268" width="250" height="55" rx="9" fill="#e3edf8" stroke="#c5d7ea" stroke-width="2"/><text x="128" y="303" font-size="20" fill="#193958" font-weight="700">Web browser</text><rect x="110" y="339" width="250" height="55" rx="9" fill="#e3edf8" stroke="#c5d7ea" stroke-width="2"/><text x="128" y="374" font-size="20" fill="#193958" font-weight="700">Git client</text><rect x="410" y="215" width="360" height="210" rx="16" fill="#f6f9fc" stroke="#d1dce7" stroke-width="2"/><text x="432" y="248" font-size="17" fill="#56718a" font-weight="700">APPLICATION PROCESSES</text><rect x="430" y="268" width="320" height="55" rx="9" fill="#e3edf8" stroke="#c5d7ea" stroke-width="2"/><text x="448" y="303" font-size="20" fill="#193958" font-weight="700">Next.js application</text><rect x="430" y="339" width="320" height="55" rx="9" fill="#e3edf8" stroke="#c5d7ea" stroke-width="2"/><text x="448" y="374" font-size="20" fill="#193958" font-weight="700">Q&amp;A index worker</text><rect x="800" y="215" width="745" height="440" rx="16" fill="#f0f5fa" stroke="#bbcfdf" stroke-width="2"/><text x="823" y="249" font-size="17" fill="#56718a" font-weight="700">SERVICES  /  DEPLOYMENT-SPECIFIC</text><rect x="825" y="273" width="695" height="145" rx="16" fill="#ffffff" stroke="#d1dce7" stroke-width="2"/><text x="850" y="309" font-size="23" fill="#193958" font-weight="700">PostgreSQL 16 + pgvector</text><text x="850" y="344" font-size="18" fill="#24364b" font-weight="400">Gitka users, sessions, projects, reviews, chat and indexes</text><text x="850" y="376" font-size="18" fill="#56718a" font-weight="400">Application data, jobs, chunks and optional vectors</text><rect x="825" y="443" width="695" height="180" rx="16" fill="#ffffff" stroke="#d1dce7" stroke-width="2"/><text x="850" y="480" font-size="23" fill="#193958" font-weight="700">Forgejo 15</text><text x="850" y="515" font-size="18" fill="#24364b" font-weight="400">Repository, REST, OAuth and webhook service</text><text x="850" y="548" font-size="18" fill="#56718a" font-weight="400">Own SQLite database and Git repositories</text><text x="850" y="580" font-size="18" fill="#56718a" font-weight="400">Storage and exposure depend on deployment</text><text x="110" y="478" font-size="17" fill="#5d7489" font-weight="400">Client device is separate from the deployment environment.</text><text x="110" y="512" font-size="17" fill="#5d7489" font-weight="400">Connections are listed below to keep every endpoint unambiguous.</text><rect x="1600" y="215" width="235" height="170" rx="16" fill="#e9f1fb" stroke="#b9cde0" stroke-width="2"/><text x="1620" y="251" font-size="17" fill="#56718a" font-weight="700">EXTERNAL</text><text x="1620" y="290" font-size="22" fill="#193958" font-weight="700">OpenRouter</text><text x="1620" y="323" font-size="17" fill="#56718a" font-weight="400">AI / embeddings</text><text x="80" y="785" font-size="22" fill="#193958" font-weight="700">CONNECTIONS</text><text x="80" y="820" font-size="17" fill="#62798e" font-weight="400">Direction is source → destination; numbers are labels, not a sequence.</text><rect x="80" y="850" width="850" height="84" rx="10" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="96" y="879" font-size="18" fill="#174265" font-weight="700">01   Browser → Next.js</text><text x="96" y="909" font-size="16" fill="#516a80" font-weight="400">Uses Gitka and returns to the OAuth callback</text><rect x="80" y="950" width="850" height="84" rx="10" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="96" y="979" font-size="18" fill="#174265" font-weight="700">02   Browser → Forgejo</text><text x="96" y="1009" font-size="16" fill="#516a80" font-weight="400">Authorizes account connection (OAuth 2.0 with PKCE)</text><rect x="80" y="1050" width="850" height="84" rx="10" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="96" y="1079" font-size="18" fill="#174265" font-weight="700">03   Git client → Forgejo</text><text x="96" y="1109" font-size="16" fill="#516a80" font-weight="400">Pushes and fetches repositories</text><rect x="80" y="1150" width="850" height="84" rx="10" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="96" y="1179" font-size="18" fill="#174265" font-weight="700">04   Next.js → Forgejo</text><text x="96" y="1209" font-size="16" fill="#516a80" font-weight="400">Calls REST API and exchanges OAuth authorization codes</text><rect x="80" y="1250" width="850" height="84" rx="10" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="96" y="1279" font-size="18" fill="#174265" font-weight="700">05   Forgejo → Next.js</text><text x="96" y="1309" font-size="16" fill="#516a80" font-weight="400">Sends signed pull-request webhook; app verifies HMAC</text><rect x="980" y="850" width="850" height="84" rx="10" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="996" y="879" font-size="18" fill="#174265" font-weight="700">06   Next.js → PostgreSQL</text><text x="996" y="909" font-size="16" fill="#516a80" font-weight="400">Reads and writes application data and index jobs</text><rect x="980" y="950" width="850" height="84" rx="10" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="996" y="979" font-size="18" fill="#174265" font-weight="700">07   Index worker → PostgreSQL</text><text x="996" y="1009" font-size="16" fill="#516a80" font-weight="400">Claims jobs and writes index snapshots</text><rect x="980" y="1050" width="850" height="84" rx="10" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="996" y="1079" font-size="18" fill="#174265" font-weight="700">08   Index worker → Forgejo</text><text x="996" y="1109" font-size="16" fill="#516a80" font-weight="400">Reads repository contents</text><rect x="980" y="1150" width="850" height="84" rx="10" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="996" y="1179" font-size="18" fill="#174265" font-weight="700">09   Next.js → OpenRouter</text><text x="996" y="1209" font-size="16" fill="#516a80" font-weight="400">Requests AI reviews and Q&amp;A</text><rect x="980" y="1250" width="850" height="84" rx="10" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="996" y="1279" font-size="18" fill="#174265" font-weight="700">10   Index worker → OpenRouter</text><text x="996" y="1309" font-size="16" fill="#516a80" font-weight="400">Requests embeddings when configured</text></g></svg>